site_name: Scelo TUI
site_description: The three-pane Scelo workstation in a terminal. Drop a file in, the agent profiles, cleans, reads and analyses it, and the session exports to Python, Jupyter, R, Excel and the Scelo IDE.
site_url: https://docs.intelligentactuaries.com/scelo-tui/

# Rendered as HTML in the footer of every page. Carries the way back up to
# the hub, since this sub-site is one of several on the domain.
copyright: >-
  Copyright © 2026 Intelligent Actuaries ·
  <a href="https://docs.intelligentactuaries.com/">All documentation</a>

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  language: en
  # overrides/main.html only adds a <head> script: the one-time palette
  # reset, which has to run before Material's bundle reads localStorage.
  custom_dir: overrides
  logo: assets/tui-lockup.png
  favicon: assets/tui-mark.svg
  font:
    text: Inter
    code: JetBrains Mono
  # Neither entry carries a `media:` key, which is deliberate: Material then
  # selects the first palette for a fresh visitor rather than following the
  # OS, so everyone starts on the cream default. The toggle still works and
  # Material persists the choice per sub-site path. Do not add `media:` here
  # without meaning to hand the default back to the OS.
  palette:
    # Light (default) — IA warm cream
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark — IA warm charcoal
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  # Drop the "Made with Material for MkDocs" line from the footer. This is
  # the theme's own supported setting, and mkdocs-material is MIT, so the
  # notice is a courtesy rather than a licence condition. The copyright
  # headers inside the bundled assets are untouched, which is what the
  # licence does ask for. The footer keeps our own copyright and the link
  # back to the hub.
  generator: false
  # Points the masthead at the hub rather than at this sub-site's own index,
  # so the logo reads as "up a level", the way it does on any portal. The
  # sub-site's front page stays one click away on the Home tab.
  homepage: https://docs.intelligentactuaries.com/
  social:
    - icon: fontawesome/solid/globe
      link: https://intelligentactuaries.com
      name: intelligentactuaries.com
    - icon: fontawesome/brands/github
      link: https://github.com/intelligentactuaries/scelo-tui
      name: scelo-tui on GitHub

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - First run: getting-started/first-run.md
  - Guide:
      - The three panes: guide/panes.md
      - The pipeline: guide/pipeline.md
      - Analyses: guide/analyses.md
      - Charts: guide/charts.md
      - Steering it in chat: guide/chat.md
      - Export: guide/export.md
      - The live mirror: guide/live.md
      - Whose terminal it is in: guide/hosts.md
      - Models: guide/models.md
  - Reference:
      - Commands: reference/commands.md
      - Keys and mouse: reference/keys.md
      - Configuration: reference/configuration.md
      - Limits: reference/limits.md
